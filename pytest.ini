[pytest]
testpaths = tests

# Steps 01 through 15b share run state and must run in order, so nothing here
# enables parallelism. Each step is a separate process, driven by runner.py.
addopts = -v -rs --strict-markers --tb=short

# The merged HTML report lists tests by their docstring, so keep the first line
# of every test's docstring the human-readable assertion name.
python_files = test_*.py
python_classes = Test*
python_functions = test_*

log_cli = true
log_cli_level = INFO
log_cli_format = %(message)s
